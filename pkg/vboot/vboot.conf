# VerkOS boot configuration — read by vboot from the root of the ESP.
#
#   timeout N     seconds to wait before booting the default entry (0 = at once)
#   default N     which entry that is, counting from 0
#   entry TITLE   starts an entry; the rest of the line is shown in the menu
#     kernel  PATH      kernel on the ESP, e.g. \vmlinuz
#     initrd  PATH      optional initramfs (handed over via LoadFile2)
#     cmdline ...       the kernel command line
#
# vboot also adds an entry for any vmlinuz* it finds on the ESP that is not named
# here, so dropping in a new kernel is enough to be able to boot it. Press 'e' at
# the menu to change a command line for one boot without editing this file.

timeout 5
default 0

entry VerkOS 0.1
  kernel  \vmlinuz
  initrd  \initramfs.img
  cmdline root=/dev/vda rw console=ttyAMA0 init=/sbin/urverk

# The initramfs is what finds and mounts the root; without it the kernel does
# that itself, which only works when root= names a real device directly.
entry VerkOS 0.1 (no initramfs)
  kernel  \vmlinuz
  cmdline root=/dev/vda rw console=ttyAMA0 init=/sbin/urverk

# The same boot, with urverk explaining every step it takes.
entry VerkOS 0.1 (verbose boot)
  kernel  \vmlinuz
  initrd  \initramfs.img
  cmdline root=/dev/vda rw console=ttyAMA0 init=/sbin/urverk urverk.debug

# No init at all: a shell as PID 1, for when the system will not come up.
# Nothing is mounted or started for you.
entry VerkOS 0.1 (rescue shell)
  kernel  \vmlinuz
  initrd  \initramfs.img
  cmdline root=/dev/vda rw console=ttyAMA0 init=/bin/bash
